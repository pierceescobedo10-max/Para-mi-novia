<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Niña Hermosa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #4a4a4a;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            width: 100%;
            max-width: 350px;
            padding: 25px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .photo-container {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #ff4d6d;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .heart {
            color: #ff4d6d;
            font-size: 30px;
            animation: beat 0.8s infinite alternate;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="photo-container">
            <!-- Borra el link de abajo y pega el enlace de tu foto si ya lo tienes -->
            <img src="https://unsplash.com" alt="Nosotros">
        </div>

        <h1>Para el amor de mi vida ❤️</h1>
        <p>
            Eres lo mejor que me ha pasado y no me imagino mis días sin ti. 
            Sé que a veces las cosas se ponen difíciles, pero mi único deseo 
            es cuidarte, hacerte feliz y seguir sumando momentos a tu lado.
            
            ¡Te amo con todo mi corazón!
        </p>

        <div class="heart">❤️</div>
    </div>

</body>
</html>
